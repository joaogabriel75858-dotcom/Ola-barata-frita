name: Windows-VPS-Tailscale

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Instalando o Tailscale
      run: |
        choco install tailscale -y
        refreshenv

    - name: Conectando ao Tailscale
      run: tailscale up --authkey tskey-auth-kKXK18d4ey11CNTRL-Wa1FND3HQReADGkxKpDcQe2gdCpucMx9K

    - name: Ativando o Acesso Remoto (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user administrator SenhaGamer123# /add
        net localgroup administrators administrator /add

    - name: Mantendo a Maquina Viva
      run: |
        $seconds = 21600
        Start-Sleep -Seconds $seconds
        
